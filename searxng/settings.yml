use_default_settings: true

general:
  instance_name: "Internet Museum Research Desk"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8080
  secret_key: "configured-by-render-environment"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 8.0

# These sources expose structured or permissive public endpoints. They make the
# research desk useful from a hosted IP even when consumer search pages throttle it.
engines:
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
    display_type: list
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: reddit
    disabled: false
  - name: youtube
    disabled: false
