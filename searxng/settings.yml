use_default_settings: true

general:
  instance_name: "Internet Museum Research Desk"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8080
  secret_key: "configured-by-render-environment"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
